[project]
name = "svg2icons"
version = "0.1.0"
description = "Generate a folder of PNG icons from one SVG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cairosvg>=2.8.2,<3",
    "defusedxml>=0.7.1,<1",
]

[project.scripts]
svg2icons = "svg2icons.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["tests/**"]
